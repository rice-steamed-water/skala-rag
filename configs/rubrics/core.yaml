# Founder·Market·Technology·Moat rubric — D14 제안 (팀 승인 전)
# 설명 문서: docs/implementation/rubric-core.md
# 구간 표기: [min, max) — min 이상, max 미만.
# 승인 전에는 fixture·prompt 개발용이며 실제 추천 근거로 표시하지 않는다.

rubric_version: core-0.1.0
status: proposed          # proposed | approved
decision_id: D14
scale: {min: 1, max: 5, missing: null}
comparison: pre_rounding
statuses: [observed, missing, not_applicable]
not_applicable_allowed: false   # 14개 criterion 모두 N/A 금지 (Q3)

common_rules:
  self_claim_max_rating: 4      # 회사 자료만으로는 최대 4, 5는 독립 출처 교차확인 (Q2)
  low_rating_requires_negative_evidence: true   # 1–2는 약점의 직접 근거 필요
  conflict_policy: missing      # 미해결 상충은 missing (market.growth 예외: 1구간 차이는 낮은 쪽)
  attribution: candidate_id     # 회사명 문자열로 연결 금지
  industry_evidence_dimensions: [market]

missing_reasons:
  - not_disclosed
  - unresolved_conflict
  - proxy_only
  - attribution_unverified
  - segment_mismatch
  - after_as_of
  - currency_mismatch
  - period_mismatch

dimensions:
  founder:
    weight: 5
    criteria:
      founder.expertise:
        name: 도메인 전문성
        weight: 2
        minimum_evidence: [인물 일치가 확인된 전공·학위·연구 분야·논문/특허 중 하나 이상]
        missing_when: [attribution_unverified, not_disclosed]
        anchors:
          1: 창업팀 전공·경력이 AI·Robotics와 무관함이 확인됨
          2: 인접 분야만 확인, 핵심 기술 분야 경력 없음
          3: 관련 전공 또는 관련 분야 연구·개발 경력
          4: 핵심 분야 박사 또는 5년 이상 R&D + 관련 논문/특허
          5: 4 + 주요 저자·발명자로서 외부 인정 교차확인
      founder.industry:
        name: 관련 산업 경험
        weight: 2
        minimum_evidence: [이전 회사·직무·기간, 참여한 AI/로봇 제품·프로젝트]
        missing_when: [attribution_unverified, not_disclosed]
        anchors:
          1: 관련 산업 경험 없음이 확인됨
          2: 인접 산업 경험만
          3: 연구실·과제 수준 AI/로봇 프로젝트
          4: 기업에서 AI/로봇 제품 개발 3년 이상
          5: AI/로봇 제품 출시·양산 리드 경험
      founder.execution:
        name: 창업/사업화 경험
        weight: 1
        minimum_evidence: [이전 창업·제품 출시·사업화 참여 이력 (현 회사 성과 제외)]
        missing_when: [attribution_unverified, not_disclosed]
        anchors:
          1: 경력 전체 확인, 제품·사업 경험 전무
          2: 연구·개발 경험만, 사업화 참여 없음
          3: 첫 창업이나 이전 직장에서 출시·사업화 참여
          4: 이전 창업 또는 제품 출시 직접 책임
          5: 이전 창업 Exit 또는 이전 제품 상용 성공 교차확인

  market:
    weight: 30
    criteria:
      market.size:
        name: 목표 시장 규모
        weight: 10
        metric: sam_usd
        unit: USD
        minimum_evidence: [세부 시장 정의·수치·단위·지역·기준연도·출처]
        missing_when: [segment_mismatch, not_disclosed, currency_mismatch]
        caps:
          - {condition: tam_only, max_rating: 3}
        bands:
          - {rating: 1, max: 100000000}
          - {rating: 2, min: 100000000, max: 500000000}
          - {rating: 3, min: 500000000, max: 2000000000}
          - {rating: 4, min: 2000000000, max: 10000000000}
          - {rating: 5, min: 10000000000}
      market.growth:
        name: 시장 성장성
        weight: 10
        metric: cagr_pct
        minimum_evidence: [같은 세부 시장의 CAGR(3년 이상, 시작·종료 연도) 또는 연도별 전망치]
        missing_when: [segment_mismatch, unresolved_conflict, period_mismatch, not_disclosed]
        conflict_rule: "출처 간 1구간 차이 → 낮은 쪽 채택 + limitations; 2구간 이상 → missing"
        bands:
          - {rating: 1, max: 0}
          - {rating: 2, min: 0, max: 5}
          - {rating: 3, min: 5, max: 15}
          - {rating: 4, min: 15, max: 25}
          - {rating: 5, min: 25}
      market.demand:
        name: 수요/확장성
        weight: 10
        minimum_evidence: [세부 시장의 구체적 문제, 실제 도입 사례]
        missing_when: [segment_mismatch, proxy_only, not_disclosed]
        anchors:
          1: 도입 수요가 약하다는 근거
          2: 도입 사례 거의 없고 장애 요인 큼
          3: 문제·도입 사례 확인, 한 산업 국한
          4: 복수 기업 도입 사례 + 인접 산업 확장 근거
          5: 4 + 정책·통계 교차확인, 2개 이상 산업 확산

  technology:
    weight: 25
    criteria:
      technology.maturity:
        name: 핵심 기술 완성도
        weight: 10
        minimum_evidence: [개발 단계의 직접 자료(시연·인증·출시·기술 문서)]
        missing_when: [attribution_unverified, proxy_only, not_disclosed]
        anchors:
          1: TRL 1–3 개념·기초 연구
          2: TRL 4–5 실험실 시제품
          3: TRL 6 실제 유사 환경 시연
          4: TRL 7–8 실제 환경 파일럿·인증 완료
          5: TRL 9 상용 판매·운영, 제3자 확인
      technology.reliability:
        name: 실제 환경 성능/안정성
        weight: 5
        minimum_evidence: [테스트 조건과 결과 수치]
        missing_when: [attribution_unverified, not_disclosed]
        anchors:
          1: 현장 실패·리콜·안전사고 근거
          2: 실험실·통제 환경 결과만
          3: 실제 환경 실증 확인, 수치 제한
          4: 실제 환경 테스트 수치 공개(조건 명시)
          5: 고객 현장 장기 운용 지표 교차확인
      technology.integration:
        name: AI/HW/SW 통합
        weight: 5
        minimum_evidence: [구성요소와 연결 구조를 설명하는 기술 문서·논문·발표]
        missing_when: [attribution_unverified, not_disclosed]
        anchors:
          1: 외부 의존 + 통합 문제 확인
          2: 대부분 외부 조립, 자체 기여 제한
          3: 핵심 일부 자체 개발 + 외부 플랫폼 통합
          4: 핵심 3요소 이상 자체 개발, 통합 구조 설명
          5: 4 + 통합 성과가 논문·제3자로 확인
      technology.commercialization:
        name: 확장/상용화 가능성
        weight: 5
        minimum_evidence: [출시 단계, PoC·계약·양산 계획 또는 관측 결과]
        missing_when: [attribution_unverified, not_disclosed]
        anchors:
          1: 사업화 중단·PoC 실패·주요 고객 이탈
          2: 추상적 로드맵, PoC 없음
          3: PoC 진행 + 구체적 출시 로드맵
          4: 유료 계약 또는 PoC→구매 전환
          5: 복수 고객 반복 구매 또는 양산 체계

  moat:
    weight: 20
    criteria:
      moat.differentiation:
        name: 경쟁사 대비 차별성
        weight: 5
        minimum_evidence: [이름이 명시된 비교 대상과 비교 항목]
        missing_when: [proxy_only, attribution_unverified, not_disclosed]
        anchors:
          1: 경쟁 제품 대비 열위 확인
          2: 경쟁 제품과 유사, 차별점 불명확
          3: 명시된 경쟁사 대비 정성적 차별점
          4: 같은 조건 비교에서 1개 이상 핵심 지표 정량 우위
          5: 복수 핵심 지표 정량 우위 + 독립 출처
      moat.ip:
        name: 기술/특허 진입장벽
        weight: 5
        minimum_evidence: [출원인 식별이 확인된 특허 목록과 핵심 기술 관련성]
        missing_when: [attribution_unverified, not_disclosed]
        zero_hit_rule: "검색 0건만으로 1 금지 — 출원인명 변형 확인 후에만 1"
        anchors:
          1: 출원인 식별 확인 후 관련 특허·출원 없음
          2: 출원만 소수, 핵심 관련성 낮음
          3: 핵심 관련 등록 1–2건 또는 출원 다수
          4: 핵심 관련 등록 3건 이상 또는 해외 Family
          5: 핵심 관련 등록 10건 이상 + 해외 Family + 피인용
      moat.data:
        name: 데이터/학습 경쟁력
        weight: 5
        minimum_evidence: [데이터 확보 방식·규모·종류와 학습 구조의 구체적 설명]
        missing_when: [proxy_only, not_disclosed]
        anchors:
          1: 데이터 확보 제약 근거
          2: 공개 데이터·시뮬레이션 위주
          3: 자체 데이터셋, 재학습 구조 설명 제한
          4: 현장 데이터 수집→재학습 구조 확인
          5: 4 + Data Flywheel 성능 향상 수치 확인
      moat.lock_in:
        name: 고객 락인/생태계
        weight: 5
        minimum_evidence: [연동·전용 플랫폼·계약 구조·파트너십 중 하나 이상의 구체 근거]
        missing_when: [proxy_only, not_disclosed]
        anchors:
          1: 고객 이탈·경쟁 제품 교체 사례
          2: 단품 판매, 대체 용이 확인
          3: 락인 요소 1가지
          4: 락인 요소 2가지
          5: 락인 요소 3가지 이상 + 재계약·확장 계약
