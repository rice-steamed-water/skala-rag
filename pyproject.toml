[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skala-rag"
version = "0.1.0"
description = "Physical AI / Robotics startup research and evaluation project skeleton"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "langchain-core>=1.6.6",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.12",
    "playwright==1.63.0",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "reportlab==4.4.9",
    "sentence-transformers>=5,<6",
    "torch>=2.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/skala_rag"]

[tool.hatch.build.targets.wheel.force-include]
"configs/runtime.json" = "skala_rag/_config/runtime.json"

[tool.hatch.build.targets.sdist.force-include]
"configs/runtime.json" = "configs/runtime.json"
"src/skala_rag/prompt/text" = "src/skala_rag/prompt/text"

[tool.ruff]
target-version = "py311"
src = ["src"]
# Read-only source documents are not maintained Python code.
extend-exclude = ["docs/raws"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["browser: 실제 Chromium(Playwright)을 실행하는 테스트"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
